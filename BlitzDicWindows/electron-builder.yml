appId: de.phil2001.blitzdic
productName: BlitzDic
directories:
  output: dist/windows
files:
  - desktop/**/*
  - src/**/*
  - ui/**/*
  - package.json
  - SYSTEMVORAUSSETZUNGEN.md
extraResources:
  - from: models/diarization
    to: models/diarization
    filter: ["model.int8.onnx", "nemo_en_titanet_small.onnx"]
  - from: licenses/diarization
    to: licenses/diarization
  - from: models/whisper
    to: models/whisper
    filter: ["**/*", "!.cache/**/*"]
  - from: models/parakeet-ultra
    to: models/parakeet-ultra
    filter: ["**/*", "!.cache/**/*"]
  - from: dist/speech/blitzdic-speech
    to: speech-runtime
  - from: ../LICENSE
    to: licenses/BlitzDic-LICENSE.txt
  - from: speech/README.md
    to: licenses/Speech-model-attribution.md
  - from: licenses/speech-models.json
    to: licenses/Speech-model-provenance.json
  - from: licenses/speech-models
    to: licenses/speech-models
# Electron fuses, flipped in the packaged BlitzDic.exe (development runs unaffected).
electronFuses:
  # The installed exe cannot be misused as a general Node.js interpreter.
  runAsNode: false
  # Only the packaged app.asar is loaded, checked against its embedded hash.
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
  # Still enabled for the packaged tests: verify-installed.mjs drives the app with
  # Playwright (needs --inspect) and its TLS fixture trusts a test CA through
  # NODE_EXTRA_CA_CERTS. Disable both once signed releases get another test path.
  enableNodeOptionsEnvironmentVariable: true
  enableNodeCliInspectArguments: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/blitzdic.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  include: installer/autostart.nsh
