name: Build Windows Whisper runtime with Ruy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ruy:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OpenNMT/CTranslate2
          ref: 5de572ef60b67a0276c5989ee73d0072808ff4c3
          path: ct2-source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile with Ruy and without Intel runtime dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git -C ct2-source submodule update --init --recursive third_party/cpu_features third_party/spdlog third_party/ruy
          cmake -S ct2-source -B ct2-build -A x64 '-DCMAKE_POLICY_VERSION_MINIMUM=3.5' -DBUILD_CLI=OFF -DBUILD_TESTS=OFF -DWITH_RUY=ON -DWITH_MKL=OFF -DWITH_DNNL=OFF -DOPENMP_RUNTIME=NONE
          cmake --build ct2-build --config Release --parallel 2
          cmake --install ct2-build --config Release --prefix "$PWD/ct2-runtime"
      - name: Build and install the experimental Python wheel
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install 'pybind11==3.0.1' setuptools wheel 'pefile==2024.8.26'
          $env:CTRANSLATE2_ROOT = "$PWD/ct2-runtime"
          Copy-Item ct2-runtime/bin/ctranslate2.dll ct2-source/python/ctranslate2/
          $sources = [ordered]@{
            ctranslate2 = 'ct2-source'
            cpu_features = 'ct2-source/third_party/cpu_features'
            spdlog = 'ct2-source/third_party/spdlog'
            ruy = 'ct2-source/third_party/ruy'
            cpuinfo = 'ct2-source/third_party/ruy/third_party/cpuinfo'
            clog = 'ct2-source/third_party/ruy/third_party/cpuinfo/deps/clog'
          }
          foreach ($component in $sources.GetEnumerator()) {
            $notices = @(Get-ChildItem -LiteralPath $component.Value -File | Where-Object Name -Match '^(LICENSE|COPYING|NOTICE)(\.|$)')
            if (!$notices.Count) { throw "Missing notice for $($component.Key)" }
            foreach ($notice in $notices) {
              Copy-Item -LiteralPath $notice.FullName -Destination "ct2-source/python/LICENSE.$($component.Key).$($notice.Name).txt"
            }
          }
          python -m pip wheel --no-deps --no-build-isolation ct2-source/python -w ct2-wheel
          $wheel = Get-ChildItem ct2-wheel/*.whl | Select-Object -First 1
          @'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('ct2-wheel').glob('*.whl'))) as wheel:
              for name in ('ctranslate2', 'cpu_features', 'spdlog', 'ruy', 'cpuinfo', 'clog'):
                  assert any(Path(path).name.startswith(f'LICENSE.{name}.') for path in wheel.namelist()), name
          '@ | python -
          @(
            'Experimental Windows x64 CPU wheel. Ruy ON, MKL OFF, DNNL OFF, OpenMP NONE.'
            "CTranslate2: $(git -C ct2-source rev-parse HEAD)"
            (git -C ct2-source submodule status --recursive)
            "Wheel SHA-256: $((Get-FileHash -LiteralPath $wheel.FullName).Hash)"
          ) | Set-Content -Encoding utf8 ct2-wheel/build-provenance.txt
          python -m pip install $wheel.FullName 'faster-whisper==1.2.1' 'av==16.0.1'
      - name: Verify binary imports and actual CPU INT8 speech recognition
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path BlitzDicWindows/.runtime | Out-Null
          powershell.exe -NoProfile -File BlitzDicWindows/scripts/make-long-speech.ps1
          @'
          import hashlib
          from pathlib import Path
          import ctranslate2
          import pefile
          from faster_whisper import WhisperModel
          from huggingface_hub import snapshot_download

          package = Path(ctranslate2.__file__).parent
          files = list(package.glob('*.dll')) + list(package.glob('*.pyd'))
          assert any(file.name.lower() == 'ctranslate2.dll' for file in files), files
          for file in files:
              with pefile.PE(file) as pe:
                  entries = getattr(pe, 'DIRECTORY_ENTRY_IMPORT', []) + getattr(pe, 'DIRECTORY_ENTRY_DELAY_IMPORT', [])
                  imports = [entry.dll.decode('ascii').lower() for entry in entries]
              assert not any(name.startswith(('libiomp', 'mkl', 'dnnl', 'vcomp')) for name in imports), imports
              print(file.name, hashlib.sha256(file.read_bytes()).hexdigest(), imports)
          assert 'int8' in ctranslate2.get_supported_compute_types('cpu')
          directory = snapshot_download('Systran/faster-whisper-small', revision='536b0662742c02347bc0e980a01041f333bce120',
                                        allow_patterns=['config.json','model.bin','tokenizer.json','vocabulary.*','preprocessor_config.json'])
          model = WhisperModel(directory, device='cpu', compute_type='int8', local_files_only=True)
          segments, _ = model.transcribe('BlitzDicWindows/.runtime/long-speech.wav', language='en')
          text = ' '.join(segment.text for segment in segments).lower()
          assert 'apples' in text and 'grapes' in text and 'continue tomorrow morning' in text, text
          print('PASS: Windows Ruy CPU INT8 build recognizes the start and end of the Whisper Small fixture.')
          '@ | python -
      - name: Retain the verified wheel for package integration
        uses: actions/upload-artifact@v7
        with:
          name: ctranslate2-ruy-windows-cp312
          path: ct2-wheel/
          if-no-files-found: error
          retention-days: 7
