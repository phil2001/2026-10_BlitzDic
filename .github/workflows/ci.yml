name: Windows tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BlitzDicWindows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BlitzDicWindows/package-lock.json
      - run: npm ci
      - run: npm test
