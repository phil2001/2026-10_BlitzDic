name: Windows tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BlitzDicWindows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BlitzDicWindows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: powershell.exe -NoProfile -File scripts/test-uia-scope.ps1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.4
      - run: python scripts/test-wav-encode.py
      - run: python scripts/test-hold-keys.py
      - run: python scripts/test-escape-control.py
      - run: python scripts/test-target-scope.py
      - run: python scripts/test-output-mute.py
